<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICA Mock Assessment</title>
  <link rel="stylesheet" href="/ui/style.css" />
</head>
<body>
  <header id="topbar">
    <a class="brand" href="/" title="All challenges">← <span id="brand-title">ICA</span></a>
    <nav id="stage-tabs"></nav>
    <span class="spacer"></span>
    <span id="timer" class="timer" title="Time remaining">--:--</span>
    <button id="btn-restart" title="Start a new attempt from a fresh solution">New attempt</button>
    <button id="btn-run" class="primary" title="Ctrl+Enter">Run tests</button>
  </header>

  <main id="layout">
    <section id="statement" class="pane">
      <div id="file-explorer">
        <h3>Files</h3>
        <ul id="file-list"></ul>
      </div>
      <div id="readme" class="markdown"></div>
    </section>

    <section id="center" class="pane">
      <div id="file-tabs"></div>
      <div id="editor"></div>
    </section>

    <section id="right" class="pane">
      <div id="results">
        <h3>Results</h3>
        <div id="results-body" class="muted">Run the tests to see results.</div>
      </div>
    </section>
  </main>

  <!--
    Load plain UMD libs (marked, Split.js) BEFORE Monaco's AMD loader. Their UMD
    wrappers check for `define.amd`; once Monaco's loader defines it, they would
    register as anonymous AMD modules instead of attaching to `window`, leaving
    `marked` / `Split` undefined. Loading them first attaches the globals.
  -->
  <!-- Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Resizable panels -->
  <script src="https://cdn.jsdelivr.net/npm/split.js@1.6.5/dist/split.min.js"></script>
  <!-- Monaco (defines AMD require/define) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
  <script src="/ui/app.js"></script>
</body>
</html>
